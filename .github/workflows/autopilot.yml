name: FixMyCode PSEO Autopilot

on:
  schedule:
    - cron: '0 3 * * *' # Run daily at 03:00 UTC
  workflow_dispatch: # Manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for committing and pushing updated data

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Harvester & Extractor (New Manuals Discovery)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG || 'amazinrevie0a-20' }}
        run: |
          python pipeline/1_harvester.py
          python pipeline/2_extractor.py

      - name: Trigger IndexNow Ping
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN || 'https://gettinytool.com' }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python pipeline/3_indexnow.py

      - name: Commit Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/src/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update error database [skip ci]" && git push origin main)
